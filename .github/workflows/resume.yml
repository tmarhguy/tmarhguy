name: Resume

# Compiles docs/resume/hardware.tex and software.tex. On pull requests,
# verify only. On push to main (and manual runs), also publish the PDFs
# under public/. Path filters keep this off unrelated commits; the
# PDF-only follow-up commit cannot retrigger the workflow.

on:
  push:
    branches:
      - main
    paths:
      - 'docs/resume/**'
      - '.github/workflows/resume.yml'
      - 'scripts/build-resumes.mjs'
      - 'src/data/profile.json'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/resume/**'
      - '.github/workflows/resume.yml'
      - 'scripts/build-resumes.mjs'
      - 'src/data/profile.json'
  workflow_dispatch:

concurrency:
  group: resume-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  compile:
    name: Compile LaTeX resume
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compile both resumes
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: docs/resume
          root_file: |
            hardware.tex
            software.tex
          compiler: latexmk
          args: -pdf -halt-on-error -file-line-error -interaction=nonstopmode

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install PDF validation tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Validate one-page layout
        run: node scripts/build-resumes.mjs --verify-only docs/resume

      - name: Upload review PDFs
        uses: actions/upload-artifact@v4
        with:
          name: resumes
          path: docs/resume/*.pdf
          if-no-files-found: error

      - name: Publish PDFs to public/
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: node scripts/build-resumes.mjs --verify-only docs/resume --publish

      - name: Commit updated PDFs
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          file_pattern: 'public/Tyrone-Marhguy-Hardware-Resume.pdf public/Tyrone-Marhguy-Software-Resume.pdf'
          commit_message: 'chore: resume latex compilation'
