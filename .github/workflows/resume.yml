name: Resume

# Compiles docs/resume/hardware.tex and software.tex. On pull requests,
# verify only. On push to main (and manual runs), also publish the PDFs
# under public/. Path filters keep this off unrelated commits; the
# PDF-only follow-up commit cannot retrigger the workflow.

on:
  push:
    branches:
      - main
    paths:
      - 'docs/resume/**'
      - '.github/workflows/resume.yml'
      - 'scripts/build-resumes.mjs'
      - 'src/data/profile.json'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/resume/**'
      - '.github/workflows/resume.yml'
      - 'scripts/build-resumes.mjs'
      - 'src/data/profile.json'
  workflow_dispatch:

concurrency:
  group: resume-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  compile:
    name: Compile LaTeX resume
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compile both resumes
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: docs/resume
          root_file: |
            hardware.tex
            software.tex
          compiler: latexmk
          args: -pdf -halt-on-error -file-line-error -interaction=nonstopmode

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install PDF validation tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Validate one-page layout
        run: node scripts/build-resumes.mjs --verify-only docs/resume

      - name: Upload review PDFs
        uses: actions/upload-artifact@v4
        with:
          name: resumes
          path: docs/resume/*.pdf
          if-no-files-found: error

      - name: Publish PDFs to public/
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: node scripts/build-resumes.mjs --verify-only docs/resume --publish

      # Rebase-retry instead of git-auto-commit: concurrent main pushes were
      # rejecting the PDF commit with a non-fast-forward error.
      - name: Commit updated PDFs
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/Tyrone-Marhguy-Hardware-Resume.pdf public/Tyrone-Marhguy-Software-Resume.pdf
          if git diff --staged --quiet; then
            echo 'No PDF changes to commit.'
            exit 0
          fi
          git commit -m 'chore: resume latex compilation'
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying…"
            sleep $((attempt * 3))
          done
          echo 'Failed to push resume PDFs after retries.'
          exit 1
